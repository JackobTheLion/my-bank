description: Rejects a transfer when the sender has insufficient funds
request:
  method: POST
  url: /internal/accounts/transfers
  headers:
    Authorization: Bearer accounts-transfer-contract-token
    Content-Type: application/json
  matchers:
    headers:
      - key: Authorization
        regex: 'Bearer [^\s]+'
  body:
    senderLogin: ivanov
    recipientLogin: petrov
    amount: 101
response:
  status: 409
  headers:
    Content-Type: application/problem+json
  body:
    status: 409
    detail: Insufficient funds
