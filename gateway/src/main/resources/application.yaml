spring:
  application:
    name: gateway
  config:
    import: "consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      config:
        format: YAML
      discovery:
        query-passing: true
    loadbalancer:
      cache:
        enabled: false
    gateway:
      server:
        webmvc:
          routes:
            - id: accounts
              uri: lb://accounts
              predicates:
                - Path=/accounts/**
              filters:
                - RewritePath=^/accounts/health$, /actuator/health
            - id: cash
              uri: lb://cash
              predicates:
                - Path=/cash/**
            - id: transfer
              uri: lb://transfer
              predicates:
                - Path=/transfer/**

server:
  port: ${SERVER_PORT:8081}
