spring:
  application:
    name: cash
  config:
    import: "consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      config:
        format: YAML
      discovery:
        query-passing: true
    loadbalancer:
      cache:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8180/realms/my-bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8180/realms/my-bank/protocol/openid-connect/certs}
          audiences:
            - cash
      client:
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak.localhost:8180/realms/my-bank/protocol/openid-connect/token}
        registration:
          cash:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: ${CASH_ACCOUNTS_CLIENT_ID:cash}
            client-secret: ${CASH_ACCOUNTS_CLIENT_SECRET}
            scope: accounts:cash,notifications:write

server:
  port: ${SERVER_PORT:8083}
